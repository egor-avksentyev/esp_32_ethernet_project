; PlatformIO Project Configuration File — ESP32 companion board for the
; Mega 2560 audio firmware (see https://github.com/egor-avksentyev/260422-030547-megaatmega2560)
;
; https://docs.platformio.org/page/projectconf.html

; 2026-10-21: companion hardware moved from a classic ESP32 dev board to a Waveshare
; ESP32-S3-DEV-KIT-N16R8 (ESP32-S3, 16MB flash, 8MB octal PSRAM) — env name kept as "esp32dev"
; to avoid touching anything that references it, only the board/chip config below changed.
; Octal-PSRAM build settings copied from KnobControl's platformio.ini (same chip family,
; already proven on real hardware) — generic esp32-s3-devkitc-1 board + manual flash/PSRAM
; overrides, same pattern used for octal-PSRAM S3 boards without a dedicated PlatformIO entry.
[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
; 2026-10-23: this board exposes a SECOND USB-CDC interface (shows up as a short-numbered
; /dev/cu.usbmodemNNNNN name, e.g. usbmodem11101) that carries no Serial output at all (likely
; the chip's JTAG/debug endpoint, not application UART) — `pio device monitor` kept
; auto-selecting that dead port instead of the real one. Pinned explicitly to the long
; hex-named port (tied to this specific board's own embedded USB serial number, stable across
; replugs) so `pio device monitor`/`-t upload -t monitor` always finds the right one without
; having to pick from a list or pass --port by hand every time.
monitor_port = /dev/cu.usbmodem5CF71102491
upload_port = /dev/cu.usbmodem5CF71102491
; WiFi.h / WebServer.h / HTTPClient.h — все встроены в arduino-esp32, отдельных lib_deps не нужно.
; WebSockets (links2004) — единственная внешняя зависимость, для постоянного соединения под
; удержание кнопок Up/Down на веб-странице (motor_ws.h/.cpp) — обычный /cmd (WebServer.h) на
; каждый тик открывал бы новое TCP-соединение (Connection: close жёстко зашит в WebServer.h),
; на Wi-Fi это иногда даёт заметные паузы мотора при удержании
lib_deps = links2004/WebSockets @ ^2.4.1
build_flags =
    -DBOARD_HAS_PSRAM
    ; Найдено живьём (2026-10-20): без этого флага у WebSockets.h дефолт WEBSOCKETS_TCP_TIMEOUT —
    ; 5000мс на КАЖДУЮ запись (broadcastTXT/broadcastBIN), если TCP-запись хоть немного подвиснет
    ; (нестабильный Wi-Fi у кноба). mega_link.cpp's megaLinkPoll() вызывает это синхронно, инлайново,
    ; на каждую строку MENU:/SETTINGS:/MUTE:/STREAMER: от Меги (~раз в 200мс) — одна подвисшая запись
    ; блокирует приём UART от Меги (и весь остальной однопоточный loop()) на целых 5с, повторяясь на
    ; каждой следующей строке, пока клиент не отвалится. KnobControl уже использует 800мс для того же
    ; самого соединения с этой же стороны — здесь симметрично то же значение.
    ;
    ; ЭТО ЗНАЧЕНИЕ МОЛЧА НЕ ДЕЙСТВОВАЛО (найдено живьём 2026-10-25, через ту же канарейку —
    ; sendTXT() виснул на 10008мс+, намного дольше настроенных здесь 800). Причина ТА ЖЕ, что уже
    ; нашли и исправили в KnobControl (project memory
    ; project_knobcontrol_tcp_timeout_zero_bug) — предполагалось, что у этого проекта более новое
    ; ядро Arduino-ESP32 (не подвержено багу), но это оказалось НЕВЕРНО: номер пакета PlatformIO
    ; здесь "espressif32" без пина версии вводит в заблуждение — реальное ядро (проверено напрямую
    ; через esp_arduino_version.h в установленном framework-arduinoespressif32) — 2.0.17, ТО ЖЕ
    ; самое, что у кноба. WebSocketsServer.cpp на этом ядре применяет макрос через целочисленное
    ; деление (`setTimeout(WEBSOCKETS_TCP_TIMEOUT / 1000)`) — 800/1000 превращается в 0, а
    ; WiFiClient::setTimeout(0) по конвенции POSIX SO_SNDTIMEO/SO_RCVTIMEO означает "таймаута нет
    ; вообще". Любое значение здесь меньше 1000 на этом ядре молча равно "бесконечность", не
    ; "быстрее" — должно оставаться кратным 1000 (это ядро умеет только целые секунды) и не меньше
    ; 1000.
    -DWEBSOCKETS_TCP_TIMEOUT=1000
