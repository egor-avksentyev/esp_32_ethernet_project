<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход в Spotify…</title>
</head>
<body style="background:#000;color:#eee;font-family:sans-serif;text-align:center;padding-top:60px">
<div id="msg">Переходим на страницу входа Spotify…</div>
<script>
// Публичный (не секретный) Client ID приложения из Spotify Developer Dashboard — при
// Authorization Code + PKCE это не секрет (в отличие от Client Secret, который тут
// нарочно не используется), нормально держать прямо в JS открытой страницы. Совпадает
// со значением SP_CLIENT_ID в src/web_control.cpp этого же репозитория и с CLIENT_ID
// в callback.html — все три места ссылаются на одно и то же зарегистрированное приложение.
const CLIENT_ID = '1a0298a844e24d6d8ab31c9342760d42';
const REDIRECT_URI = 'https://egor-avksentyev.github.io/esp_32_ethernet_project/spotify/callback.html';

function b64url(buf) {
  let s = '';
  new Uint8Array(buf).forEach((b) => { s += String.fromCharCode(b); });
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function randomString(len) {
  const bytes = new Uint8Array(len);
  crypto.getRandomValues(bytes);
  return b64url(bytes.buffer).slice(0, len);
}
async function challengeFor(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return b64url(digest);
}

(async () => {
  const returnUrl = new URLSearchParams(location.search).get('return');
  if (!returnUrl) {
    document.getElementById('msg').textContent = 'Не указан адрес возврата (?return=...) — эта страница не открывается напрямую';
    return;
  }

  const verifier = randomString(64);
  const challenge = await challengeFor(verifier);

  // ВАЖНО: verifier едет в state, не в localStorage/sessionStorage. Живой тест на iOS показал,
  // что Safari (ITP, защита от "bounce tracking") стирает script-writable хранилище (даже
  // localStorage) у доменов, через которые браузер быстро проходит транзитом в цепочке
  // редиректов — а у нас именно так: ESP32 → github.io (эта страница) → accounts.spotify.com →
  // github.io (callback.html) → снова ESP32. github.io в этой цепочке — ровно такой "транзитный"
  // домен, поэтому verifier из localStorage долетал до callback.html пустым (подтверждено
  // живьём, диагностика показала verifier:ОТСУТСТВУЕТ при этом localStorage вообще доступен:true).
  // state как раз ничего не теряет по пути — он просто едет туда-обратно в самом URL, поэтому
  // кладём verifier туда же, вместе с адресом возврата. Да, это чуть ослабляет защиту PKCE
  // (verifier и code оказываются рядом в одном URL, а не только у того, кто их создал) — но раз
  // единственный способ, который реально работает в Safari, это он, и весь путь идёт по https
  // (кроме последнего шага на локальный IP ESP32, не покидающего домашнюю сеть)
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    response_type: 'code',
    redirect_uri: REDIRECT_URI,
    scope: [
      'user-read-playback-state',
      'user-modify-playback-state',
      'user-read-currently-playing',
      // user-read-private убран — был нужен только spMarket() (страна для top-tracks), а тот
      // эндпоинт сам Spotify снёс в феврале 2026 (см. openArtistDetail() в web_control.cpp)
      'user-library-read',
      // Сердечко (сохранить/убрать трек) — раньше был PUT/DELETE /me/tracks под тем же скоупом,
      // Spotify заменил его на унифицированный /me/library, но сам scope не поменялся
      'user-library-modify',
      // Нужны, чтобы GET /playlists/{id}/items реально отдавал треки для СВОИХ плейлистов —
      // без playlist-read-private приватные свои же плейлисты выглядели бы как "не ваш плейлист"
      'playlist-read-private',
      'playlist-read-collaborative',
    ].join(' '),
    code_challenge_method: 'S256',
    code_challenge: challenge,
    state: JSON.stringify({ r: returnUrl, v: verifier }),
  });
  const authorizeUrl = 'https://accounts.spotify.com/authorize?' + params.toString();
  // "Выйти" на странице устройства (spLogout()) стирает только локальный токен — саму сессию
  // на accounts.spotify.com это не трогает. Без этого шага /authorize видел бы, что браузер
  // (или, на телефоне, приложение Spotify) уже залогинен, и молча переавторизовывал бы ТОТ ЖЕ
  // аккаунт без формы ввода — пользователь не мог выбрать другой. Проверено живьём: /logout
  // принимает continue= на другой адрес accounts.spotify.com и после выхода едет по нему дальше
  location.href = 'https://accounts.spotify.com/logout?continue=' + encodeURIComponent(authorizeUrl);
})();
</script>
</body>
</html>
